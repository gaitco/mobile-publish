<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:640px;overflow:hidden;
    font-family:Inter,system-ui,sans-serif;
    background:
      radial-gradient(1100px 600px at 88% -10%, rgba(138,147,196,.30), transparent 62%),
      radial-gradient(800px 520px at 0% 110%, rgba(91,100,160,.28), transparent 60%),
      linear-gradient(152deg,#2a3154 0%,#232a49 55%,#1b2038 100%);
    color:#fff;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(900px 520px at 26% 42%,#000 25%,transparent 78%)}
  .wrap{position:relative;height:100%;padding:62px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{height:44px;width:149px;align-self:flex-start;object-fit:contain;opacity:.97}
  h1{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:96px;letter-spacing:-3px;line-height:1;
     background:linear-gradient(180deg,#fff 30%,#c3c9e8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .kicker{font-size:15px;font-weight:600;letter-spacing:4.5px;text-transform:uppercase;color:#a8b0dc;margin-bottom:22px}
  .sub{font-size:26px;font-weight:400;color:#ccd2ee;margin-top:20px;letter-spacing:-.3px}
  .stores{display:flex;gap:12px;margin-top:34px}
  .chip{font-size:16px;font-weight:500;color:#e3e7f8;padding:11px 20px;border:1px solid rgba(255,255,255,.20);
        border-radius:999px;background:rgba(255,255,255,.07)}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .cmd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:16px;color:#aab2dd;
       background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:13px 18px}
  .cmd .p{color:#7f88b8}
  .by{font-size:17px;color:#a8b0dc;text-align:right;letter-spacing:.2px;padding-bottom:14px}
  .by b{color:#e8ebf8;font-weight:600}
</style></head><body>
